# =============================================================================
# DG-202611 / S07 -- a real Scan-to-Map candidate produced from a real seed
#                    request, attributable to that request.
#
# This file describes SYNTHETIC INPUT ONLY: an occupancy map, ray-cast LiDAR
# geometry, wheel odometry, a synthetic AMCL observer, and a synthetic base
# plant.  It specifies NO software-under-test output.  No candidate is
# injected, no relocalization state is injected, no /cmd_vel_nav is published,
# and no map->odom ground-truth transform is published.  Every /dg/* value in
# the evidence is computed by the real, unmodified nodes.
#
# PRECONDITIONS
#   - scenario_runner starts the integration with enable_nav2:=false,
#     enable_multisource_fusion:=true, cmd_vel_output_topic:=/dg/test_cmd_vel.
#   - Nodes under test, unmodified: scan_map_relocalization_node,
#     active_relocalization_node (+ active_relocalization_core),
#     navigation_health_node, cmd_vel_arbiter_node, lidar_robust_node,
#     gnss_quality_node, multisource_fusion_node.
#   - Shipped thresholds are used as-is and are NOT overridden by this file:
#       matcher    min_score 0.45, min_inlier_ratio 0.45,
#                  max_mean_distance 0.30, sample_stride 2,
#                  max_scan_range 8.0,
#                  coarse search +-0.20 m in 0.05 m steps and
#                  +-10 deg in 2.5 deg steps,
#                  fine search +-0.05 m in 0.02 m steps and
#                  +-3 deg in 1.0 deg steps
#       supervisor max_covariance 0.5, suspect_samples 2, trigger_samples 2,
#                  stop_velocity 0.03, angular_speed 0.18 rad/s,
#                  yaw_tolerance 1.5 deg, segment_deltas_deg [10, -20, 10],
#                  settle_time 0.5 s, segment_timeout 8.0 s,
#                  max_attempt_duration 30.0 s, max_attempts 2,
#                  verification_samples 3, max_verify_position_jump 0.5 m,
#                  max_verify_yaw_jump 20 deg, timer_period 0.1 s (10 Hz)
#   - The supervisor's command topic is /cmd_vel_recovery.  Nothing in this run
#     publishes the real /cmd_vel.
#
# INPUT_CONDITIONS
#   - /map: deterministic 80 x 80 grid at 0.1 m, border walls plus one interior
#     strip (cells x 30..31, y 15..65), republished at map_hz.
#   - /scan: 360 beams, generator RAYCAST against that same occupancy grid from
#     the plant's true pose, so the geometry handed to the matcher is
#     consistent with the published /map.  scan.frame_id equals
#     plant.sensor_frame_id ("laser").
#   - TF: the plant publishes dynamic odom->base_footprint and static
#     base_footprint->laser, which is the only TF the matcher looks up.
#     map->odom is deliberately NOT published.
#   - /odom: plant-integrated pose and twist.  Every phase pins
#     odom.linear_x: 0.0.  The historical S01-S04 default of 0.05 exceeds
#     stop_velocity 0.03 and would hold STOPPING open forever.
#   - /amcl_pose: SYNTHETIC_AMCL_SURROGATE = plant truth plus a constant bias
#     of (+0.15 m, +0.15 m, +0.14 rad = +8.021 deg).  The seed handed to the
#     real matcher is therefore wrong by 0.2121 m and 8.021 deg -- inside the
#     matcher's coarse window (+-0.20 m per axis, +-10 deg) so the error is
#     genuinely recoverable, and large enough that the seed pose on its own
#     scores below both acceptance thresholds (see OFFLINE_MATCHER_EVIDENCE).
#   - publish_initialpose: false.  The Scan-to-Map node is event driven: it
#     publishes /dg/relocalization/match_quality only when it receives a seed
#     on /dg/relocalization/seed or a pose on /initialpose.  Suppressing the
#     periodic bootstrap /initialpose is what makes every match_quality message
#     attributable to exactly one real supervisor seed request.
#   - GNSS stays nominal for the whole run so the trigger is unambiguously the
#     AMCL covariance ramp and nothing else.
#
# REAL_TRIGGER_PATH
#   /amcl_pose covariance ramps 0.05 -> 1.10 across P02_DEGRADING and crosses
#   max_covariance 0.5 at t = 3.0 + 3.0 * (0.45 / 1.05) = 4.286 s.
#     assess_health() reports AMCL_COVARIANCE_HIGH -> triggerable
#     -> 2 triggerable samples: NORMAL -> SUSPECTED
#     -> 2 more: SUSPECTED -> TRIGGERED            (10 Hz supervisor)
#     -> TRIGGERED -> STOPPING
#     -> the plant's odom twist is already 0.0 (<= stop_velocity 0.03), so
#        STOP_CONFIRMED lands on the first STOPPING tick
#     -> _begin_attempt(): seed_source LAST_TRUSTED, seed_pose = the BIASED
#        surrogate pose latched while the state was still NORMAL.  If LiDAR
#        geometry ever marks the health degraded before the trigger, the core
#        falls back to seed_source CURRENT_AMCL; because the plant never
#        translates, both seeds carry the same bias.
#     -> ACTIVE_SCAN, segment 1 of 3, target = odom yaw + 10 deg
#   The rotation is executed by the real chain, not by this file:
#     navigation_health_node maps relocalization TRIGGERED / STOPPING /
#     ACTIVE_SCAN / WAITING_CANDIDATE / VERIFYING to RECOVERING; only then does
#     cmd_vel_arbiter_node forward /cmd_vel_recovery to /dg/test_cmd_vel; only
#     then does the plant integrate a rotation.  No synthetic command is
#     injected anywhere.
#     -> SEGMENT_REACHED (|yaw error| <= 1.5 deg) -> settle 0.5 s
#     -> WAITING_CANDIDATE + REQUEST_CANDIDATE
#     -> the supervisor publishes the biased seed on /dg/relocalization/seed
#     -> the REAL matcher scores the ray-cast scan against the real distance
#        field and returns an ACCEPTED candidate on
#        /dg/relocalization/match_quality and /scan_match_pose
#
# EXPECTED_TRANSITIONS   (relocalization_state; only the ten real names exist:
#   NORMAL SUSPECTED TRIGGERED STOPPING ACTIVE_SCAN WAITING_CANDIDATE VERIFYING
#   RECOVERED FAILED MANUAL_REQUIRED)
#     NORMAL -> SUSPECTED -> TRIGGERED -> STOPPING -> ACTIVE_SCAN
#            -> WAITING_CANDIDATE -> VERIFYING -> RECOVERED
#   navigation_state:
#     NOMINAL -> LOCALIZATION_SUSPECT -> RECOVERING -> LOCALIZATION_SUSPECT
#   Reaching RECOVERED in S07 is expected and acceptable.  Because this
#   scenario deliberately does NOT converge the surrogate, the AMCL covariance
#   stays at 1.10 after recovery, so navigation_health_node keeps reporting
#   LOCALIZATION_SUSPECT and the arbiter releases control by emitting zero with
#   reason STATE_LOCALIZATION_SUSPECT and cmd_vel source NONE.  The clean
#   post-recovery release is S08's subject, not S07's.
#   TRIGGERED and STOPPING each last exactly one 0.1 s supervisor tick.  The
#   evaluator also samples at 10 Hz, so either may be aliased out of
#   samples.csv / timeline.csv.  The authoritative record is the recorded
#   /dg/relocalization/status stream in the rosbag.
#
# REQUIRED_OUTPUTS   (all produced by the software under test, none injected)
#   - /dg/relocalization/status reaches SUSPECTED, TRIGGERED, STOPPING,
#     ACTIVE_SCAN and WAITING_CANDIDATE, with trigger_reason containing
#     AMCL_COVARIANCE_HIGH.
#   - >= 1 message on /dg/relocalization/seed, with seed_source LAST_TRUSTED or
#     CURRENT_AMCL and request_candidate true on the emitting tick.
#   - >= 1 /dg/relocalization/match_quality message with accepted=true,
#     reason=ACCEPTED, score >= 0.45, inlier_ratio >= 0.45,
#     mean_distance <= 0.30, used_points > 0.
#   - Every match_quality message is preceded by a seed message
#     (attribution).  With publish_initialpose false there is no other
#     trigger for the matcher.
#   - >= 1 message on /scan_match_pose (the matcher's corrected pose).
#   - /dg/navigation/status reaches RECOVERING.
#   - /dg/test_cmd_vel carries a non-zero angular_z only while
#     relocalization_state is ACTIVE_SCAN.
#   - /dg/lidar/quality and /dg/gnss/quality present throughout;
#     /dg/fusion/status present throughout.
#
# PASS_CRITERIA
#   NOTE: result_writer.evaluate_scenario() currently has no S07 branch, so it
#   emits the warning UNKNOWN_SCENARIO_NO_SCENARIO_SPECIFIC_ASSERTIONS and the
#   automated PASS/FAIL is decided only by the generic gates
#   (samples_present, integration_alive, real_cmd_vel_is_unpublished,
#   finite_fusion_outputs).  The criteria below are the review criteria for this
#   scenario and are checked against samples.csv / timeline.csv / the rosbag.
#   P1  The supervisor reached WAITING_CANDIDATE via
#       NORMAL -> SUSPECTED -> TRIGGERED -> STOPPING -> ACTIVE_SCAN, with no
#       state name outside the ten real names.
#   P2  At least one accepted match_quality message exists and satisfies all
#       three real matcher thresholds simultaneously.
#   P3  Every accepted match_quality message is attributable to a preceding
#       /dg/relocalization/seed message; match_quality count <= seed count.
#   P4  The candidate pose in match_quality differs from the seed pose, i.e.
#       the matcher moved the pose rather than confirming the seed.
#   P5  The real /cmd_vel has zero publishers for the whole run.
#   P6  Fusion outputs stay finite for the whole run.
#
# FAIL_CRITERIA
#   F1  relocalization_state reaches FAILED or MANUAL_REQUIRED.
#   F2  Zero accepted match_quality messages, or an accepted message that
#       violates any of the three matcher thresholds.
#   F3  A match_quality message with no preceding seed message (attribution
#       broken -- would mean a periodic /initialpose slipped in).
#   F4  Any /dg/* value in the artifacts that was not produced by a node under
#       test.
#   F5  Non-zero /cmd_vel publishers, or any non-zero command on
#       /dg/test_cmd_vel while the state is not ACTIVE_SCAN.
#   F6  A non-finite fusion output, or the integration launch exiting early.
#
# SAFETY_ASSERTIONS
#   S1  The real /cmd_vel is never published.  The supervisor writes only to
#       /cmd_vel_recovery and the arbiter writes only to /dg/test_cmd_vel;
#       schema validation additionally refuses plant.command_topic == /cmd_vel.
#   S2  command_linear_x is 0.0 in every supervisor output; recovery motion is
#       rotation only, bounded by segment_deltas_deg and max_total_rotation
#       60 deg.
#   S3  Rotation is only ever forwarded while navigation health is RECOVERING;
#       in every other navigation state the arbiter emits zero.
#   S4  No /dg/* topic is published by this scenario or by the injector.
#   S5  No RECOVERED state, no candidate, and no match result is injected.
#   S6  No map->odom transform is published, so no perfect ground-truth pose is
#       available to the software under test through TF.
#   S7  The plant is subscribe-only on /dg/test_cmd_vel; it cannot move unless
#       the real arbiter commands it.
#
# OUT_OF_SCOPE
#   - Localization ACCURACY.  The surrogate reads synthetic ground truth, so
#     this run says nothing about how well a real AMCL would localize.
#   - Nav2.  It is intentionally not running, so no navigation goal, path or
#     controller behaviour is exercised.
#   - Real LiDAR physics, real wheel dynamics, latency, and sensor noise.
#   - Real-robot and Gazebo evidence.  This is SYNTHETIC_SOFTWARE_VALIDATION,
#     NOT_REAL_ROBOT_DATA, NOT_GAZEBO_DATA,
#     NOT_COMPETITION_PERFORMANCE_EVIDENCE.
#   - Timing and CPU performance claims.  The matcher call cost measured
#     offline (0.11-0.31 s) is a property of this VM, not a specification.
#   - The post-recovery control handoff (S08).
#   - Retry and attempt-exhaustion behaviour; segment 1 is expected to succeed.
#
# KNOWN_SYNTHETIC_LIMITATIONS
#   - The true pose is AUTHORED BY THE TEST RIG.  plant.start_x / start_y /
#     start_yaw define it, and the ray-cast LiDAR and the AMCL surrogate are
#     both generated from it.
#   - GROUND_TRUTH_USED_BY_SUT = NO.  The surrogate's ground-truth access is on
#     the input side only.  The software under test receives /scan, /map,
#     /odom, /amcl_pose and TF, and no perfect map->odom transform, so no node
#     under test ever reads the true pose.
#   - The matcher's mean_distance is a SCAN-TO-MAP RESIDUAL in metres measured
#     against synthetic geometry: it is the mean distance from the transformed
#     scan points to the nearest occupied cell in an approximate distance
#     field.  It is NOT a positioning error in metres and must never be
#     reported as one.  score is a unitless
#     inlier_ratio * exp(-mean_distance / 0.35) figure of merit, not a
#     probability.
#   - The scan is generated from the same grid the matcher matches against, so
#     the residual is optimistically small.  Real sensor noise, unmapped
#     obstacles and map staleness would all raise it.
#   - The plant is forward-Euler kinematics with no wheel dynamics, no noise
#     and no latency, so stop detection and rotation tracking are easier than
#     on hardware.
#   - The AMCL surrogate is NOT AMCL: its error is a single constant bias, not
#     a particle-filter distribution, and its covariance is scripted by this
#     file rather than estimated.
#   - GNSS is nominal throughout, so cross-coupled GNSS failure is untested.
#
# OFFLINE_MATCHER_EVIDENCE  (pure-function call, no ROS, no scenario run:
#   refine_pose_near_seed + approximate_distance_field from
#   scan_map_relocalization_node, with occupancy_matrix / beam_angles /
#   raycast_ranges from synthetic_injector_node, scan built at the true pose,
#   seed offset by this file's bias, laser->base_footprint identity,
#   sample_stride 2 -> 180 points)
#     true pose (0, 0, +10.0 deg), seed (+0.15, +0.15, +8.021 deg)
#     seed offset needed: dx -0.15 m, dy -0.15 m, dyaw +1.98 deg
#       (inside the coarse window +-0.20 m per axis / +-10 deg)
#     seed pose scored on its own: score 0.2440, inlier_ratio 0.3782,
#       mean_distance 0.1533 -> would be REJECTED, so the seed is genuinely
#       wrong and the matcher's search is what produces the candidate
#     refine_pose_near_seed: ACCEPTED
#       score 0.9672 (>= 0.45), inlier_ratio 1.0000 (>= 0.45),
#       mean_distance 0.0117 m (<= 0.30), used_points 180
#       residual to the authored true pose: 0.0141 m, -0.479 deg
#     the same bias was checked across every yaw the plant can land on
#     (0.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0 deg): ACCEPTED in all seven,
#     score 0.9672-0.9890, inlier_ratio 1.0000, mean_distance <= 0.0117 m,
#     and the seed alone stayed below both thresholds in all seven
#     (max seed score 0.3306, max seed inlier_ratio 0.4846)
#     matcher cost measured on this VM: 0.11-0.55 s per call across repeated
#     runs (981 candidate poses x 180 points in pure Python).  This is a
#     property of this VM under load, not a specification.  It is far inside
#     both segment_timeout 8.0 s and max_attempt_duration 30.0 s.
#
# TIMING_BUDGET  (supervisor and sensors both at 10 Hz)
#     covariance crosses 0.5                                    t = 4.286 s
#   + 0.1  first supervisor tick that observes it
#   + 0.3  NORMAL -> SUSPECTED -> TRIGGERED (3 triggerable samples)
#   + 0.1  TRIGGERED -> STOPPING
#   + 0.1  STOPPING -> STOP_CONFIRMED -> ACTIVE_SCAN (odom twist already 0)
#   + 0.3  navigation-health tick and the arbiter's 0.2 s switch guard
#   + 1.1  segment 1 rotation: 10 deg at 0.18 rad/s, stop at 1.5 deg tolerance
#   + 0.5  settle_time
#   + 0.1  WAITING_CANDIDATE + seed published
#   + 0.8  real matcher (measured 0.11-0.55 s, budgeted at 0.8 s)
#   + 0.1  candidate consumed -> VERIFYING
#   + 0.3  3 verification samples -> RECOVERED
#   = 8.1 s expected RECOVERED; accepted candidate expected at about 7.5 s.
#   duration_sec 16.0 leaves 7.9 s of margin, which also covers the worst case
#   where segments 1 and 2 both fail and segment 3 succeeds (about +5.9 s,
#   RECOVERED near 14.0 s).  scenario_runner adds settle_sec 2.0 on top.
# =============================================================================
scenario_id: S07
name: real_candidate_from_real_seed_request
duration_sec: 16.0
seed: 20261107
rates:
  sensor_hz: 10.0
  map_hz: 1.0
# Event-driven matcher: no periodic bootstrap /initialpose, so every
# match_quality message is attributable to a real supervisor seed request.
publish_initialpose: false
map:
  resolution: 0.1
  width: 80
  height: 80
  origin_x: -4.0
  origin_y: -4.0
  border: true
  interior_wall: true
  interior_wall_x_min: 30
  interior_wall_x_max: 31
  interior_wall_y_min: 15
  interior_wall_y_max: 65
scan:
  generator: raycast
  beam_count: 360
  range_min: 0.05
  range_max: 8.0
  frame_id: laser
  raycast_step: 0.05
plant:
  enabled: true
  command_topic: /dg/test_cmd_vel
  start_x: 0.0
  start_y: 0.0
  start_yaw: 0.0
  max_linear: 0.5
  max_angular: 1.0
  kinematics: PLANAR_DIFFERENTIAL_DRIVE
  integration: EULER_FORWARD
  command_latency_sec: 0.0
  noise_stddev: 0.0
  publish_tf: true
  odom_frame_id: odom
  base_frame_id: base_footprint
  sensor_frame_id: laser
amcl_surrogate:
  enabled: true
  follows_plant: true
  accesses_plant_ground_truth: true
  bias_x: 0.15
  bias_y: 0.15
  bias_yaw: 0.14
  # S07 does not converge: the surrogate stays biased for the whole run so the
  # evidence is the candidate itself, not the handoff.  S08 covers convergence.
  converge_on_match: false
  noise_stddev: 0.0
  match_pose_topic: /scan_match_pose
  map_frame_id: map
phases:
  - id: P01_NOMINAL
    start_sec: 0.0
    end_sec: 3.0
    gnss: {quality: 4, satellites: 12, hdop: 0.8, differential_age: 0.5, fix_available: true}
    lidar: {mode: normal, valid_fraction: 1.0, angle_min: -3.141592653589793, angle_max: 3.141592653589793, range_m: 3.0}
    amcl: {publish: true, covariance: 0.05, yaw_covariance: 0.03}
    odom: {publish: true, linear_x: 0.0}
  - id: P02_DEGRADING
    start_sec: 3.0
    end_sec: 6.0
    gnss: {quality: 4, satellites: 12, hdop: 0.8, differential_age: 0.5, fix_available: true}
    lidar: {mode: normal, valid_fraction: 1.0, angle_min: -3.141592653589793, angle_max: 3.141592653589793, range_m: 3.0}
    amcl: {publish: true, covariance: 0.05, covariance_end: 1.10, yaw_covariance: 0.03}
    odom: {publish: true, linear_x: 0.0}
  - id: P03_COVARIANCE_HIGH
    start_sec: 6.0
    end_sec: 16.0
    gnss: {quality: 4, satellites: 12, hdop: 0.8, differential_age: 0.5, fix_available: true}
    lidar: {mode: normal, valid_fraction: 1.0, angle_min: -3.141592653589793, angle_max: 3.141592653589793, range_m: 3.0}
    amcl: {publish: true, covariance: 1.10, yaw_covariance: 0.03}
    odom: {publish: true, linear_x: 0.0}
expected:
  relocalization_states_required: [SUSPECTED, ACTIVE_SCAN, WAITING_CANDIDATE]
  navigation_states_required: [RECOVERING]
  seed_requests_min_count: 1
  accepted_match_min_count: 1
  match_quality_min_score: 0.45
  match_quality_min_inlier_ratio: 0.45
  match_quality_max_mean_distance: 0.30
  match_quality_attributable_to_seed: true
  real_cmd_vel_publishers: 0
  ground_truth_used_by_sut: false
